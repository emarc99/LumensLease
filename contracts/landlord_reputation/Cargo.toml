[package]
name = "landlord-reputation"
version = "0.1.0"
edition = "2021"
authors = ["LumensLease Protocol <maintainers@lumenslease.xyz>"]
description = "On-Chain Landlord Trust & Property Audit Registry on Soroban (Stellar)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
